<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusFlash Ultra Royale</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f0f0f0;
      gap: 32px;
    }

    .logo {
      text-align: center;
    }
    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .logo h1 span { color: #e8303a; }
    .logo p {
      font-size: 12px;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* Hot link button */
    .hotlink {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #e8303a;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 16px 40px;
      border-radius: 50px;
      box-shadow: 0 0 0 0 rgba(232,48,58,0.5);
      animation: ripple 2s ease-in-out infinite;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .hotlink:hover {
      transform: scale(1.05);
      box-shadow: 0 0 32px rgba(232,48,58,0.5);
      animation: none;
    }
    .hotlink:active { transform: scale(0.97); }

    /* Watch icon inside button */
    .hotlink svg { flex-shrink: 0; }

    @keyframes ripple {
      0%   { box-shadow: 0 0 0 0   rgba(232,48,58,0.5); }
      70%  { box-shadow: 0 0 0 18px rgba(232,48,58,0);   }
      100% { box-shadow: 0 0 0 0   rgba(232,48,58,0);    }
    }

    .sub {
      font-size: 11px;
      color: #444;
      letter-spacing: 1px;
      text-align: center;
    }
    .sub a { color: #666; text-decoration: none; }
    .sub a:hover { color: #e8303a; }
  </style>
</head>
<body>

  <div class="logo">
    <h1>Nexus<span>Flash</span></h1>
    <p>Ultra Royale &nbsp;·&nbsp; One-click Android Repair Suite</p>
  </div>

  <!-- HOT LINK -->
  <a class="hotlink" href="simulator/index.html">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="13" stroke="white" stroke-width="2"/>
      <path d="M16 9v7l4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Launch Watch Emulator
  </a>

  <div class="sub">
    OnePlus Watch 3 &nbsp;·&nbsp; Obsidian Titanium &nbsp;·&nbsp;
    <a href="docs/getting-started.md">Getting Started</a>
  </div>

</body>
</html>
