name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Installs Gradle 8.7 and puts `gradle` on PATH.
      # Avoids committing gradle-wrapper.jar (binary excluded by default
      # Android .gitignore) and avoids the fragile curl-download workaround
      # that caused exit code 22 (HTTP 404 on the raw GitHub JAR URL).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusflash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
