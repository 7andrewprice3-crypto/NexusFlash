name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # gradle-wrapper.jar is excluded by default Android .gitignore (*.jar).
      # Download it from the pinned Gradle release so ./gradlew can bootstrap.
      - name: Download Gradle wrapper JAR
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.7.1/gradle/wrapper/gradle-wrapper.jar"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusflash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
